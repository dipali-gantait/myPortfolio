<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" width="1440" height="520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@600;700;800&amp;display=swap');
      .title-bold { font-family: 'Poppins', sans-serif; font-weight: 800; fill: #14233D; }
      .heading-sec { font-family: 'Poppins', sans-serif; font-weight: 700; fill: #14233D; }
      .subheading { font-family: 'Inter', sans-serif; font-weight: 600; fill: #397A80; }
      .body-txt { font-family: 'Inter', sans-serif; font-weight: 400; fill: #222A33; }
      .pill-txt { font-family: 'Inter', sans-serif; font-weight: 500; fill: #FFFFFF; }
      .gold-txt { font-family: 'Inter', sans-serif; font-weight: 700; fill: #D8B77C; }
    </style>
    <linearGradient id="bgPastel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3F8F8"/>
      <stop offset="50%" stop-color="#EAF5F3"/>
      <stop offset="100%" stop-color="#F3F8F8"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D8B77C" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#D7EEEE" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F3F8F8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#14233D" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="1440" height="520" fill="url(#bgPastel)"/>
  <g id="Experience" transform="translate(100, 50)">
    <text x="620" y="40" class="heading-sec" font-size="34" text-anchor="middle">Experience</text>
    <rect x="598" y="52" width="44" height="3" rx="1.5" fill="#397A80"/>
    <line x1="620" y1="100" x2="620" y2="400" stroke="#397A80" stroke-width="2" stroke-opacity="0.4"/>

    <g transform="translate(180, 120)">
      <rect width="390" height="110" rx="18" fill="#FFFFFF" stroke="#397A80" stroke-opacity="0.15" filter="url(#shadow)"/>
      <text x="360" y="40" class="heading-sec" font-size="19" text-anchor="end">Web Developer</text>
      <text x="360" y="66" class="body-txt" font-size="16" text-anchor="end">Gram Tarakki Foundation</text>
      <rect x="240" y="76" width="120" height="24" rx="12" fill="#E6F5F2"/>
      <text x="300" y="92" class="subheading" font-size="11" font-weight="700" text-anchor="middle">Currently Working</text>
      <circle cx="440" cy="55" r="9" fill="#397A80" stroke="#FFFFFF" stroke-width="3"/>
    </g>

    <g transform="translate(670, 260)">
      <rect width="390" height="110" rx="18" fill="#FFFFFF" stroke="#397A80" stroke-opacity="0.15" filter="url(#shadow)"/>
      <text x="30" y="40" class="heading-sec" font-size="19">Machine Learning Intern</text>
      <text x="30" y="66" class="body-txt" font-size="16">Ardent Computech Pvt. Ltd.</text>
      <rect x="30" y="76" width="145" height="24" rx="12" fill="#F5E6CC"/>
      <text x="102" y="92" class="title-bold" font-size="11" font-weight="700" text-anchor="middle">April – May | 120 Hours</text>
      <circle cx="-50" cy="55" r="9" fill="#397A80" stroke="#FFFFFF" stroke-width="3"/>
    </g>
  </g>
</svg>