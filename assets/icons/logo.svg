<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="tealGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#397A80"/>
      <stop offset="100%" stop-color="#1B4E53"/>
    </linearGradient>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8B77C"/>
      <stop offset="100%" stop-color="#B89456"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#397A80" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Geometric Faceted Monogram / Brandmark (D + G abstract prism) -->
  <g filter="url(#subtleGlow)">
    <!-- Top-left facet -->
    <path d="M24 6 L38 14 L24 22 L10 14 Z" fill="url(#tealGrad1)"/>
    <!-- Left bottom facet -->
    <path d="M10 14 L24 22 L24 38 L10 30 Z" fill="#2E646A" fill-opacity="0.9"/>
    <!-- Right bottom facet -->
    <path d="M24 22 L38 14 L38 30 L24 38 Z" fill="#1B4E53"/>
    <!-- Inner geometric core accent in champagne gold -->
    <polygon points="24,18 30,22 24,26 18,22" fill="url(#goldGrad1)"/>
    <circle cx="24" cy="22" r="2.5" fill="#FFFFFF"/>
  </g>
</svg>

